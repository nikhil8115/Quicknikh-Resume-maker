<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Badge Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Straw Hat Gradients -->
    <linearGradient id="straw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="straw-brim-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Red Ribbon Gradient -->
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Panda Face Shading -->
    <linearGradient id="panda-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="panda-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Glow & Container -->
  <circle cx="60" cy="60" r="56" fill="url(#bg-grad)" stroke="#6366f1" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Panda Ears (Behind Head & Hat) -->
  <circle cx="34" cy="38" r="14" fill="url(#panda-dark)"/>
  <circle cx="34" cy="38" r="8" fill="#475569" opacity="0.6"/>
  <circle cx="86" cy="38" r="14" fill="url(#panda-dark)"/>
  <circle cx="86" cy="38" r="8" fill="#475569" opacity="0.6"/>

  <!-- Panda Head -->
  <circle cx="60" cy="68" r="32" fill="url(#panda-white)" filter="url(#shadow)"/>

  <!-- Eye Patches -->
  <!-- Left Eye Patch -->
  <ellipse cx="46" cy="66" rx="10" ry="12" fill="url(#panda-dark)" transform="rotate(-15 46 66)"/>
  <!-- Right Eye Patch -->
  <ellipse cx="74" cy="66" rx="10" ry="12" fill="url(#panda-dark)" transform="rotate(15 74 66)"/>

  <!-- Big Sparkling Cute Eyes -->
  <circle cx="47" cy="66" r="4.5" fill="#ffffff"/>
  <circle cx="48.5" cy="65" r="2" fill="#0f172a"/>
  <circle cx="46" cy="67.5" r="1.2" fill="#ffffff"/>

  <circle cx="73" cy="66" r="4.5" fill="#ffffff"/>
  <circle cx="71.5" cy="65" r="2" fill="#0f172a"/>
  <circle cx="74" cy="67.5" r="1.2" fill="#ffffff"/>

  <!-- Cute Blushing Cheeks -->
  <ellipse cx="37" cy="74" rx="5.5" ry="3.5" fill="#f472b6" opacity="0.75"/>
  <ellipse cx="83" cy="74" rx="5.5" ry="3.5" fill="#f472b6" opacity="0.75"/>

  <!-- Nose -->
  <path d="M 57 73 Q 60 71 63 73 Q 60 77 57 73 Z" fill="url(#panda-dark)"/>

  <!-- Happy Smiling Mouth -->
  <path d="M 56 76 Q 60 79 64 76" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- Little Panda Paws Holding the Edge -->
  <ellipse cx="38" cy="94" rx="7" ry="5.5" fill="url(#panda-dark)"/>
  <ellipse cx="82" cy="94" rx="7" ry="5.5" fill="url(#panda-dark)"/>

  <!-- ============================================== -->
  <!-- STRAW HAT (Worn on Top of Head) -->
  <!-- ============================================== -->
  <g filter="url(#shadow)">
    <!-- Hat Crown (Dome) -->
    <path d="M 40 40 C 40 22 80 22 80 40 Z" fill="url(#straw-grad)"/>

    <!-- Subtle Straw Texture Weave Lines on Crown -->
    <path d="M 46 36 Q 60 31 74 36" fill="none" stroke="#ca8a04" stroke-width="1" opacity="0.6"/>
    <path d="M 50 30 Q 60 26 70 30" fill="none" stroke="#ca8a04" stroke-width="1" opacity="0.6"/>

    <!-- Red Hat Ribbon Band -->
    <path d="M 39 37 Q 60 41 81 37 L 82 41 Q 60 45 38 41 Z" fill="url(#ribbon-grad)"/>

    <!-- Ribbon Knot / Tail on Side -->
    <path d="M 78 39 Q 86 42 84 48 Q 80 44 78 41 Z" fill="#dc2626"/>

    <!-- Hat Brim (Wide Angled Oval) -->
    <ellipse cx="60" cy="42" rx="46" ry="11" fill="url(#straw-brim-grad)" stroke="#a16207" stroke-width="1"/>

    <!-- Straw Brim Inner Ring Texture -->
    <ellipse cx="60" cy="42" rx="36" ry="8" fill="none" stroke="#ca8a04" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
